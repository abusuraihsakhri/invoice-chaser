name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest Test Suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_api.py -v

  frontend-build:
    name: Frontend Build & Static Export Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build static export
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Verify output directory
        run: |
          test -f frontend/out/index.html
          test -f frontend/out/invoices/index.html
          test -f frontend/out/clients/index.html
          test -f frontend/out/reminders/index.html
          test -f frontend/out/settings/index.html
